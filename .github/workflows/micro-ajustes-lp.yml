name: JobForged — micro ajustes LP

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar ajustes de UX e copy
        shell: python
        run: |
          from pathlib import Path

          page = Path("app/page.tsx")
          text = page.read_text(encoding="utf-8")

          replacements = {
              "Três diferenciais. Um só processo.": "Sua marca. Seu canal. Sua inteligência.",
              "cada candidato. Seu RH decide.": "cada candidato.<br />Seu RH decide.",
          }

          changed = False
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True

          marker = "const closeMenu = () => setMenuOpen(false);"
          effect = '''const closeMenu = () => setMenuOpen(false);\n\n  useEffect(() => {\n    const markAgentCard = () => {\n      document.querySelectorAll<HTMLElement>(\".floating-card, [class*=\\\"floating-card\\\"]\").forEach((element) => {\n        if (element.textContent?.toLowerCase().includes(\"agente de triagem\")) {\n          element.classList.add(\"agent-triage-float\");\n        }\n      });\n    };\n\n    markAgentCard();\n    const observer = new MutationObserver(markAgentCard);\n    observer.observe(document.body, { childList: true, subtree: true });\n    return () => observer.disconnect();\n  }, []);'''

          if marker in text and "agent-triage-float" not in text:
              text = text.replace(marker, effect, 1)
              changed = True

          if changed:
              page.write_text(text, encoding="utf-8")

          css = Path("app/globals.css")
          css_text = css.read_text(encoding="utf-8")
          css_marker = "/* JobForged LP micro-ajustes 2026-08-27 */"
          css_block = '''\n\n/* JobForged LP micro-ajustes 2026-08-27 */\nhtml {\n  view-transition-name: root;\n}\n\n::view-transition-group(root),\n::view-transition-old(root),\n::view-transition-new(root) {\n  animation-duration: 240ms;\n  animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);\n}\n\nhtml.theme-switching,\nhtml.theme-switching body,\nhtml.theme-switching main,\nhtml.theme-switching section,\nhtml.theme-switching header,\nhtml.theme-switching footer,\nhtml.theme-switching .site-header,\nhtml.theme-switching .button,\nhtml.theme-switching a,\nhtml.theme-switching button {\n  transition-duration: 240ms !important;\n  transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1) !important;\n}\n\n.agent-triage-float {\n  translate: 0 42px !important;\n}\n\n@media (max-width: 700px) {\n  .agent-triage-float {\n    translate: 0 30px !important;\n  }\n}\n'''

          if css_marker not in css_text:
              css.write_text(css_text + css_block, encoding="utf-8")

      - name: Validar alterações
        run: |
          grep -n "Sua marca. Seu canal. Sua inteligência." app/page.tsx
          grep -n "agent-triage-float" app/page.tsx app/globals.css
          grep -n "240ms" app/globals.css | tail -5

      - name: Commitar alterações
        run: |
          git config user.name "JobForged Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nova para commit."
          else
            git commit -m "Ajusta copy e suaviza transicao de tema da LP"
            git push
          fi

      - name: Remover workflow temporário
        if: always()
        run: |
          rm -f .github/workflows/micro-ajustes-lp.yml
          git config user.name "JobForged Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/micro-ajustes-lp.yml
          if git diff --cached --quiet; then
            echo "Workflow temporário já removido."
          else
            git commit -m "Remove workflow temporario de ajustes"
            git push
          fi
