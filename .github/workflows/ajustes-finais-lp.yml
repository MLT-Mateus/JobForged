name: JobForged — ajustes finais LP

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ajustar copy, tema e balão de triagem
        shell: python
        run: |
          from pathlib import Path
          import re

          page = Path('app/page.tsx')
          text = page.read_text(encoding='utf-8')

          copy_options = [
              ('Três diferenciais. Um só processo.', 'Sua marca. Seu canal. Sua inteligência.'),
              ('Três diferenciais. Um só processo', 'Sua marca. Seu canal. Sua inteligência.'),
          ]
          for old, new in copy_options:
              text = text.replace(old, new)

          text = text.replace(
              'Triamos e organizamos cada candidato e seu RH decide',
              'Triamos e organizamos cada candidato. Seu RH decide.'
          )
          text = text.replace(
              'Triamos e organizamos cada candidato. Seu RH decide.',
              'Triamos e organizamos cada candidato.<br />Seu RH decide.'
          )

          # Garante que qualquer card que contenha "Agente de triagem" receba uma classe estável.
          if 'agent-triage-float' not in text:
              pattern = r'(<[^>]+className=)(["\'])([^"\']*floating[^"\']*)(\2)([^>]*>[\s\S]{0,1600}?Agente de triagem)'
              def add_class(match):
                  classes = match.group(3)
                  if 'agent-triage-float' not in classes:
                      classes += ' agent-triage-float'
                  return match.group(1) + match.group(2) + classes + match.group(4) + match.group(5)
              text, _ = re.subn(pattern, add_class, text, count=1, flags=re.I)

          page.write_text(text, encoding='utf-8')

          css = Path('app/globals.css')
          css_text = css.read_text(encoding='utf-8')
          marker = '/* JobForged — ajustes finais LP */'
          block = '''\n\n/* JobForged — ajustes finais LP */\nhtml {\n  view-transition-name: root;\n}\n\n::view-transition-group(root),\n::view-transition-old(root),\n::view-transition-new(root) {\n  animation-duration: 220ms;\n  animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);\n}\n\nhtml.theme-switching,\nhtml.theme-switching body,\nhtml.theme-switching main,\nhtml.theme-switching section,\nhtml.theme-switching header,\nhtml.theme-switching footer,\nhtml.theme-switching .site-header,\nhtml.theme-switching .button,\nhtml.theme-switching a,\nhtml.theme-switching button {\n  transition-duration: 220ms !important;\n  transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1) !important;\n}\n\n.agent-triage-float {\n  transform: translateY(46px) !important;\n}\n\n@media (max-width: 700px) {\n  .agent-triage-float {\n    transform: translateY(32px) !important;\n  }\n}\n'''
          if marker not in css_text:
              css.write_text(css_text + block, encoding='utf-8')

      - name: Mostrar resumo
        run: |
          echo '--- Copy ---'
          grep -n -E 'Sua marca\. Seu canal|Três diferenciais' app/page.tsx || true
          echo '--- Agente ---'
          grep -n 'agent-triage-float' app/page.tsx app/globals.css || true
          echo '--- Tema ---'
          grep -n '220ms' app/globals.css | tail -5 || true

      - name: Commitar e publicar
        run: |
          git config user.name 'JobForged Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx app/globals.css
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração nova.'
          else
            git commit -m 'Ajusta copy, tema e posicionamento do agente na LP'
            git push
          fi

      - name: Remover workflow temporário
        if: always()
        run: |
          rm -f .github/workflows/ajustes-finais-lp.yml
          git config user.name 'JobForged Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ajustes-finais-lp.yml
          if git diff --cached --quiet; then
            echo 'Workflow temporário já removido.'
          else
            git commit -m 'Remove workflow temporario de ajustes da LP'
            git push
          fi
