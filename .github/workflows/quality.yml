name: Qualidade da JBFD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mcp:
    name: Validar MCP operacional
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/mcp
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/mcp/package-lock.json
      - name: Instalar dependências fixadas
        run: npm ci
      - name: Testar autenticação, ferramentas e transporte MCP
        run: npm test
      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high

  validate:
    name: Validar código e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar qualidade do código
        run: npm run lint

      - name: Verificar tipos TypeScript
        run: npm run typecheck

      - name: Testar e validar a publicação
        run: npm test

  docker:
    name: Validar Docker Live e Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Construir aplicação completa
        run: docker build --build-arg APP_COMMIT="$GITHUB_SHA" -t jbfd:ci .
      - name: Preparar rede externa do proxy
        run: docker network create jbfd-ci-network
      - name: Executar dois ambientes isolados
        shell: bash
        run: |
          for environment in test live; do
            env_file="$RUNNER_TEMP/jbfd-$environment.env"
            sed -e 's/jbfd:SUBSTITUA_PELO_COMMIT/jbfd:ci/' -e 's/jobforged_jobforged_network/jbfd-ci-network/' "deploy/.env.$environment.example" > "$env_file"
            JBFD_ENV_FILE="$env_file" docker compose --project-name "jbfd-$environment" --env-file "$env_file" -f deploy/compose.yml config --quiet
            JBFD_ENV_FILE="$env_file" docker compose --project-name "jbfd-$environment" --env-file "$env_file" -f deploy/compose.yml up -d --wait --wait-timeout 120
          done
      - name: Validar todas as páginas e assets
        run: node scripts/test-node-runtime.mjs http://127.0.0.1:3101 http://127.0.0.1:3100
      - name: Diagnóstico e limpeza
        if: always()
        shell: bash
        run: |
          for environment in test live; do
            env_file="$RUNNER_TEMP/jbfd-$environment.env"
            if [[ -f "$env_file" ]]; then
              JBFD_ENV_FILE="$env_file" docker compose --project-name "jbfd-$environment" --env-file "$env_file" -f deploy/compose.yml logs --tail 50
              JBFD_ENV_FILE="$env_file" docker compose --project-name "jbfd-$environment" --env-file "$env_file" -f deploy/compose.yml down
            fi
          done
          docker network rm jbfd-ci-network || true
