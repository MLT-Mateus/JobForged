name: Qualidade da JBFD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-security:
    name: Validar Auth e Storage nativos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construir gateway isolado
        run: docker build -f services/security-gateway/Dockerfile -t jbfd-security-gateway:isolated-acceptance .
      - name: Testar provedores reais sem dados ou credenciais dos ambientes
        run: python3 scripts/security/test-native-auth.py --ci

  database-security:
    name: Validar migrations e segurança SQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configurar Node.js para as fixtures versionadas
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Testar migrations, RLS, grants, RPCs e isolamento em PostgreSQL
        run: bash scripts/security/test-database.sh
      - name: Testar política de limitação de requisições
        run: node --test services/security-gateway/test.mjs tests/security-contracts.test.mjs
      - name: Testar bloqueios do gate de backup e migrations
        run: python3 tests/security_gate_test.py

  mcp:
    name: Validar MCP operacional
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/mcp
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/mcp/package-lock.json
      - name: Instalar dependências fixadas
        run: npm ci
      - name: Testar autenticação, ferramentas e transporte MCP
        run: npm test
      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high

  validate:
    name: Validar código e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar qualidade do código
        run: npm run lint

      - name: Verificar tipos TypeScript
        run: npm run typecheck

      - name: Validar proteção de publicação sem Auth
        run: |
          bash -n scripts/deploy-vps.sh scripts/supabase-migrate.sh scripts/jbfd-deploy-live-root.sh scripts/jbfd-deploy-test-root.sh scripts/jbfd-supabase-smtp-test-root.sh
          node --test tests/auth-readiness.test.mjs

      - name: Testar e validar a publicação
        run: npm test

  docker:
    name: Validar Docker Live e Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Construir aplicação completa
        run: docker build --build-arg APP_COMMIT="$GITHUB_SHA" -t jbfd:ci .
      - name: Construir gateway de segurança
        run: docker build -f services/security-gateway/Dockerfile -t jbfd-security-gateway:ci .
      - name: Preparar rede externa do proxy
        run: docker network create jbfd-ci-network
      - name: Executar dois ambientes isolados
        shell: bash
        run: |
          for environment in test live; do
            env_file="$RUNNER_TEMP/jbfd-$environment.env"
            sed -e 's/jbfd:SUBSTITUA_PELO_COMMIT/jbfd:ci/' -e 's/jobforged_jobforged_network/jbfd-ci-network/' "deploy/.env.$environment.example" > "$env_file"
            JBFD_ENV_FILE="$env_file" docker compose --project-name "jbfd-$environment" --env-file "$env_file" -f deploy/compose.yml config --quiet
            JBFD_ENV_FILE="$env_file" docker compose --project-name "jbfd-$environment" --env-file "$env_file" -f deploy/compose.yml up -d --wait --wait-timeout 120
          done
      - name: Validar todas as páginas e assets
        run: node scripts/test-node-runtime.mjs http://127.0.0.1:3101 http://127.0.0.1:3100
      - name: Diagnóstico e limpeza
        if: always()
        shell: bash
        run: |
          for environment in test live; do
            env_file="$RUNNER_TEMP/jbfd-$environment.env"
            if [[ -f "$env_file" ]]; then
              JBFD_ENV_FILE="$env_file" docker compose --project-name "jbfd-$environment" --env-file "$env_file" -f deploy/compose.yml logs --tail 50
              JBFD_ENV_FILE="$env_file" docker compose --project-name "jbfd-$environment" --env-file "$env_file" -f deploy/compose.yml down
            fi
          done
          docker network rm jbfd-ci-network || true

  publish-test-image:
    name: Publicar imagem Test
    needs: [mcp, validate, docker, database-security, native-security]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      vars.JBFD_AUTO_DEPLOY_TEST == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Baixar o commit aprovado pelo CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Publicar imagem versionada no GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/mlt-mateus/jobforged
          REVISION: ${{ github.sha }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          if docker manifest inspect "$IMAGE:$REVISION" >/dev/null 2>&1; then
            echo "Imagem deste commit já publicada; preservando o artefato existente."
          else
            docker build --build-arg APP_COMMIT="$REVISION" \
              --label "org.opencontainers.image.revision=$REVISION" \
              -t "$IMAGE:$REVISION" .
            docker push "$IMAGE:$REVISION"
          fi
          gateway_image="${IMAGE}-security-gateway"
          if docker manifest inspect "$gateway_image:$REVISION" >/dev/null 2>&1; then
            echo "Gateway deste commit já publicado; preservando o artefato existente."
          else
            docker build --label "org.opencontainers.image.revision=$REVISION" \
              -t "$gateway_image:$REVISION" -f services/security-gateway/Dockerfile .
            docker push "$gateway_image:$REVISION"
          fi

  deploy-test:
    name: Implantar Test
    needs: [mcp, validate, docker, database-security, native-security, publish-test-image]
    if: needs.publish-test-image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: jbfd-test
    permissions:
      contents: read
      packages: read
    steps:
      - name: Implantar somente no ambiente Test
        env:
          VPS_DEPLOY_HOST: ${{ vars.VPS_DEPLOY_HOST }}
          VPS_DEPLOY_USER: ${{ vars.VPS_DEPLOY_USER }}
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SMTP_USER: ${{ secrets.BREVO_SMTP_USER }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.actor }}
          REVISION: ${{ github.sha }}
        run: |
          if [[ -z "$BREVO_API_KEY" || -z "$BREVO_SMTP_USER" || -z "$BREVO_SMTP_KEY" ]]; then
            echo "Configure os três secrets Brevo no Environment jbfd-test antes de publicar Auth." >&2
            exit 78
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_DEPLOY_KEY" > "$HOME/.ssh/jbfd_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/jbfd_deploy" "$HOME/.ssh/known_hosts"
          ssh_args=(-i "$HOME/.ssh/jbfd_deploy" -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          target="$VPS_DEPLOY_USER@$VPS_DEPLOY_HOST"
          protocol="$(ssh "${ssh_args[@]}" "$target" "probe brevo test" 2>/dev/null)" || {
            echo "O gateway restrito da VPS ainda não aceita a configuração segura do secret Brevo. Atualize os scripts de deploy Test conforme docs/BREVO-EMAIL.md." >&2
            exit 78
          }
          if [[ "$protocol" != "brevo-test-protocol-v1" ]]; then
            echo "O gateway da VPS respondeu com uma versão incompatível para a integração Brevo." >&2
            exit 78
          fi
          if protocol="$(ssh "${ssh_args[@]}" "$target" "probe smtp test" 2>/dev/null)"; then
            if [[ "$protocol" != "supabase-smtp-test-protocol-v1" ]]; then
              echo "O gateway da VPS respondeu com uma versão incompatível para SMTP Test." >&2
              exit 78
            fi
            printf '%s\n%s\n' "$BREVO_SMTP_USER" "$BREVO_SMTP_KEY" | \
              ssh "${ssh_args[@]}" "$target" "configure smtp test"
          else
            echo "Gateway SMTP Test indisponível; publicação interrompida." >&2
            exit 78
          fi
          printf '%s\n%s\n%s\n' "$GH_USERNAME" "$GH_TOKEN" "$BREVO_API_KEY" | \
            ssh "${ssh_args[@]}" "$target" "deploy test $REVISION"
