name: Cópia offsite cifrada
run-name: Offsite backup ${{ inputs.environment }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente isolado
        required: true
        type: choice
        options:
          - test
          - live
      revision:
        description: SHA completo da implantação autorizada
        required: true
        type: string
      request_id:
        description: Identificador único da solicitação
        required: true
        type: string

permissions:
  actions: read
  contents: none

concurrency:
  group: encrypted-backup-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: backup-${{ inputs.environment }}
    steps:
      - name: Validar solicitação
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REVISION: ${{ inputs.revision }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          [[ "$ENVIRONMENT" == test || "$ENVIRONMENT" == live ]]
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9-]{1,64}$ ]]

      - name: Preparar SSH restrito
        env:
          BACKUP_SSH_KEY: ${{ secrets.BACKUP_SSH_KEY }}
          BACKUP_SSH_KNOWN_HOSTS: ${{ secrets.BACKUP_SSH_KNOWN_HOSTS }}
        run: |
          set +x
          [[ -n "$BACKUP_SSH_KEY" && -n "$BACKUP_SSH_KNOWN_HOSTS" ]]
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$BACKUP_SSH_KEY" > "$HOME/.ssh/jbfd_backup"
          printf '%s\n' "$BACKUP_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/jbfd_backup" "$HOME/.ssh/known_hosts"
          unset BACKUP_SSH_KEY BACKUP_SSH_KNOWN_HOSTS

      - name: Criar e restaurar backup no ambiente escolhido
        id: prepare
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REVISION: ${{ inputs.revision }}
          VPS_BACKUP_HOST: ${{ vars.VPS_BACKUP_HOST }}
        run: |
          [[ -n "$VPS_BACKUP_HOST" ]]
          case "$ENVIRONMENT" in
            test) backup_json="$(ssh -i "$HOME/.ssh/jbfd_backup" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "root@$VPS_BACKUP_HOST" "prepare test $REVISION")" ;;
            live) backup_json="$(ssh -i "$HOME/.ssh/jbfd_backup" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "root@$VPS_BACKUP_HOST" "prepare live $REVISION")" ;;
          esac
          printf '%s\n' "$backup_json" > "$RUNNER_TEMP/backup-metadata.json"
          jq -e --arg env "$ENVIRONMENT" --arg rev "$REVISION" \
            '.environment == $env and .revision == $rev and .scheduled == false and (.encrypted_sha256 | test("^[a-f0-9]{64}$"))' \
            "$RUNNER_TEMP/backup-metadata.json" >/dev/null
          echo "name=$(jq -r '.backup' "$RUNNER_TEMP/backup-metadata.json")" >> "$GITHUB_OUTPUT"

      - name: Transferir somente ciphertext
        env:
          VPS_BACKUP_HOST: ${{ vars.VPS_BACKUP_HOST }}
          BACKUP_NAME: ${{ steps.prepare.outputs.name }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          [[ "$BACKUP_NAME" =~ ^${ENVIRONMENT}-[0-9]{8}T[0-9]{6}Z$ ]]
          ssh -i "$HOME/.ssh/jbfd_backup" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "root@$VPS_BACKUP_HOST" "stream $BACKUP_NAME" > "$RUNNER_TEMP/offsite.jfenc"
          expected="$(jq -r '.encrypted_sha256' "$RUNNER_TEMP/backup-metadata.json")"
          actual="$(sha256sum "$RUNNER_TEMP/offsite.jfenc" | cut -d ' ' -f 1)"
          [[ "$actual" == "$expected" ]]

      - name: Armazenar ciphertext privado por 90 dias
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.prepare.outputs.name }}
          path: ${{ runner.temp }}/offsite.jfenc
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          archive: false

      - name: Baixar artefato privado e conferir ciphertext
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/artifact-check

      - name: Registrar recibo somente após a conferência externa
        env:
          VPS_BACKUP_HOST: ${{ vars.VPS_BACKUP_HOST }}
          BACKUP_NAME: ${{ steps.prepare.outputs.name }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          expected="$(jq -r '.encrypted_sha256' "$RUNNER_TEMP/backup-metadata.json")"
          actual="$(sha256sum "$RUNNER_TEMP/artifact-check/offsite.jfenc" | cut -d ' ' -f 1)"
          [[ "$actual" == "$expected" ]]
          ssh -i "$HOME/.ssh/jbfd_backup" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "root@$VPS_BACKUP_HOST" "receipt $BACKUP_NAME $actual $ARTIFACT_ID"

      - name: Remover cópias temporárias do runner
        if: always()
        run: |
          rm -f "$HOME/.ssh/jbfd_backup" "$HOME/.ssh/known_hosts" "$RUNNER_TEMP/offsite.jfenc" "$RUNNER_TEMP/backup-metadata.json"
          rm -rf "$RUNNER_TEMP/artifact-check"
