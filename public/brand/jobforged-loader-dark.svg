<svg
  width="100"
  height="100"
  viewBox="0 0 100 100"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="jf-logo-title jf-logo-description"
  preserveAspectRatio="xMidYMid meet"
>
  <title id="jf-logo-title">Logo animada com pessoa e mira</title>
  <desc id="jf-logo-description">
    Uma pessoa surge no centro enquanto uma mira procura por ela e se encaixa para formar a logo.
  </desc>

  <style>
    .jf-person {
      animation: jf-person-enter 3.2s cubic-bezier(.22, 1, .36, 1) infinite both;
      transform-box: fill-box;
      transform-origin: center;
    }

    .jf-reticle {
      animation: jf-reticle-search 3.2s linear infinite both;
      transform-box: fill-box;
      transform-origin: center;
    }

    .jf-lockup {
      animation: jf-lockup-settle 3.2s cubic-bezier(.22, 1, .36, 1) infinite both;
      transform-box: fill-box;
      transform-origin: center;
    }

    @keyframes jf-person-enter {
      0% {
        opacity: 0;
        transform: scale(.72);
      }
      11.36% {
        opacity: 1;
        transform: scale(1.04);
      }
      18.18%, 100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes jf-reticle-search {
      0%, 22.72% {
        opacity: 0;
        transform: translate(21px, -21px) rotate(4deg) scale(.96);
      }
      22.73% {
        opacity: 1;
        transform: translate(21px, -21px) rotate(4deg) scale(.96);
        animation-timing-function: cubic-bezier(.55, .08, .38, 1);
      }
      43.18% {
        opacity: 1;
        transform: translate(-21px, 21px) rotate(-5deg) scale(.98);
        animation-timing-function: cubic-bezier(.42, 0, .2, 1);
      }
      63.64% {
        opacity: 1;
        transform: translate(20px, 2px) rotate(3deg) scale(1);
        animation-timing-function: cubic-bezier(.16, 1, .3, 1);
      }
      90.91%, 100% {
        opacity: 1;
        transform: translate(0, 0) rotate(0) scale(1);
      }
    }

    @keyframes jf-lockup-settle {
      0%, 90.90% {
        transform: scale(1);
      }
      93.18% {
        transform: scale(1.045);
      }
      96.36% {
        transform: scale(.985);
      }
      100% {
        transform: scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .jf-person,
      .jf-reticle,
      .jf-lockup {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>

  <g transform="translate(27 27)">
    <g class="jf-lockup">
      <g class="jf-reticle">
        <path
          d="M14.5 36.5C9.71759 33.7205 7 29.0254 7 23.0753C7 14.1972 14.1634 7 23 7C31.8366 7 39 14.1972 39 23.0753C39 29.0254 36.2824 33.7205 31.5 36.5"
          stroke="#43D0C6"
          stroke-width="3"
          stroke-linecap="round"
        />
        <path d="M23 8V0" stroke="#43D0C6" stroke-width="3" />
        <path d="M23 46V36" stroke="#7E9CFF" stroke-width="3" />
        <path d="M38 24H46" stroke="#43D0C6" stroke-width="3" />
        <path d="M-1.19209e-07 24H8" stroke="#43D0C6" stroke-width="3" />
      </g>

      <g class="jf-person">
        <path
          d="M23 13.5C25.4853 13.5 27.5 15.5147 27.5 18C27.5 20.4853 25.4853 22.5 23 22.5C20.5147 22.5 18.5 20.4853 18.5 18C18.5 15.5147 20.5147 13.5 23 13.5Z"
          fill="#7E9CFF"
          stroke="#7E9CFF"
        />
        <path
          d="M17 30.4809V37.502C17.821 39.5183 22.7726 40.3824 22.7726 39.8423V35.3417V33.3564C22.7726 32.9963 23.3967 24.3601 23.5 24L21.6603 24C18.294 24.144 17 29.9409 17 30.4809Z"
          fill="#7E9CFF"
          stroke="#7E9CFF"
        />
        <path
          d="M29 30.4809V37.5019C28.179 39.5182 23.2274 40.3824 23.2274 39.8423V35.3416V32.3797C23.2274 32.0196 23.1033 24.3601 23 24H24.5C27.8664 24.144 29 29.9408 29 30.4809Z"
          fill="#7E9CFF"
          stroke="#7E9CFF"
        />
      </g>
    </g>
  </g>
</svg>

